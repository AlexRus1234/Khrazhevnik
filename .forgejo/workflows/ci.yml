# Хражевник — кеш-прокси и зеркало linux-репозиториев
# CI: vet → lint → test (+race) → сборка с версией из тега.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./...

      - name: Build
        # Для package main линкер Go 1.26 принимает только путь main.Version
        # (полный importpath-путь в -X не срабатывает).
        run: >
          CGO_ENABLED=0 go build -trimpath
          -ldflags "-s -w -X main.Version=${GITHUB_REF##*/}"
          -o bin/khrazhevnik ./cmd/khrazhevnik
