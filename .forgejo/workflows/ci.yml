# CI: vet → lint → test (+race) → сборка с версией из тега.
# Инфраструктура раннера — по образцу lentovodec/Intermasq:
# fedora-контейнер, Nora-прокси, step-ca, Go из tarball.

name: CI

on:
  workflow_dispatch:

jobs:
  ci:
    runs-on: docker
    container:
      image: fedora:44
    env:
      # All external dependencies via Nora where possible
      GOPROXY: "https://nora.panelka.yadr01.internal/go,direct"
      GOSUMDB: "off"
      GOPRIVATE: "git.yadr00.internal/*"
      # NOTE: do NOT set SSL_CERT_FILE / NODE_EXTRA_CA_CERTS to step-ca.crt
      # directly — that overrides the system bundle and breaks public-CA
      # trust (curl to go.dev / npm / etc fails with "unexpected end of file").
      # The 'update-ca-trust' step below adds step-ca to the system bundle,
      # after which all tools trust both public CAs AND step-ca transparently.

    steps:
      - name: Install git first (minimal fedora image lacks it)
        run: dnf install -y --setopt=install_weak_deps=False git curl

      - name: Trust Local CA
        run: |
          curl -k https://172.20.0.1:9000/roots.pem -o /etc/pki/ca-trust/source/anchors/step-ca.crt
          update-ca-trust
          git config --global http.sslCAInfo /etc/pki/ca-trust/source/anchors/step-ca.crt

      - name: Configure Nora RPM repo (custom packages if needed)
        run: |
          cat > /etc/yum.repos.d/nora.repo << 'EOF'
          [nora-runner]
          name=Nora Runner Dependencies
          baseurl=https://nora.panelka.yadr01.internal/rpm/runner/
          gpgcheck=0
          enabled=1
          priority=1
          sslverify=1
          EOF

      - name: Install remaining system dependencies
        # gcc нужен только для `go test -race` (CGO); сам бинарник
        # собирается с CGO_ENABLED=0 (static, modernc-sqlite pure Go).
        # nodejs нужен НЕ проекту, а раннеру: act/act_runner исполняет
        # JS-экшены (actions/checkout@v4) через node ВНУТРИ job-контейнера;
        # fedora:44 его не содержит → crun "node not found", exit 127.
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            bash tar \
            nodejs \
            gcc

      - name: Install Go toolchain
        run: |
          # Fedora 44 ships an older Go; khrazhevnik needs 1.26 (go.mod).
          # Tarball from go.dev. -f: fail on HTTP errors (don't pipe HTML
          # error page into tar). Download first, then extract, so we get a
          # clear error if URL is wrong.
          curl -fsSL https://go.dev/dl/go1.26.3.linux-amd64.tar.gz -o /tmp/go.tar.gz
          ls -lh /tmp/go.tar.gz
          tar -C /usr/local -xzf /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH
          /usr/local/go/bin/go version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Теги нужны для определения версии сборки ниже.
          fetch-depth: 0

      - name: Determine build version
        env:
          SHA: ${{ github.sha }}
        run: |
          TAG_VERSION="$(git describe --exact-match --tags --match='v*' HEAD 2>/dev/null || true)"
          if [ -n "$TAG_VERSION" ]; then
            VERSION="$TAG_VERSION"
            echo "Using exact Git tag: $VERSION"
          else
            VERSION="sha-${SHA:0:8}"
            echo "HEAD has no exact v* tag; using: $VERSION"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Install golangci-lint
        # Пин той же версии, что в локальной разработке; собирается
        # через Nora-прокси текущим тулчейном.
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: go test
        run: go test ./... -count=1

      - name: go test -race
        # -race requires CGO (and gcc). The binary itself is built with
        # CGO_ENABLED=0 for static linking; tests opt back in here.
        env:
          CGO_ENABLED: "1"
        run: go test -race ./... -count=1

      - name: go test -integration
        # Живые слушатели, реальный TOML-конфиг, graceful shutdown.
        env:
          CGO_ENABLED: "1"
        run: go test -race -tags integration ./test/integration/... -count=1

      - name: Build binary
        # Для package main линкер Go 1.26 принимает только путь main.Version
        # (полный importpath в -X молча не применяется; проверено локально
        # на go1.26.3). Intermasq использует полный путь, потому что там
        # Version живёт в НЕ-main пакете internal/version.
        run: |
          CGO_ENABLED=0 \
          go build -trimpath \
            -ldflags="-s -w -X main.Version=${APP_VERSION}" \
            -o khrazhevnik-ci ./cmd/khrazhevnik
          # Sanity: -version — без флага бинарник уже сервер: он читает
          # конфиг и падает на пустом jwt_secret (это тоже проверено,
          # но интеграционными тестами, не CI-сборкой).
          ./khrazhevnik-ci -version

      - name: Show binary info
        run: |
          ls -lh khrazhevnik-ci
          sha256sum khrazhevnik-ci | tee khrazhevnik-ci.sha256

      - name: Cleanup
        if: always()
        run: rm -f khrazhevnik-ci khrazhevnik-ci.sha256

  # Сборка OCI-образа из scratch → дымовые тесты → push в registry.
  # Отдельная job: podman-in-container требует --privileged (создание
  # user-namespace'ов внутри раннера). Теги пробрасывают образ в
  # ghcr.io; прочие пушей — локальная метка localhost/testing (по
  # образцу Intermasq: «не тег — не релиз»).
  oci:
    runs-on: docker
    container:
      image: fedora:44
      # podman внутри контейнера раннера открывает own namespaces —
      # без --privileged (в частности CAP_SYS_ADMIN + binfmt_misc)
      # сборка и `podman run` падают на "can't create namespace".
      options: --privileged
    env:
      GOPROXY: "https://nora.panelka.yadr01.internal/go,direct"
      GOSUMDB: "off"
      GOPRIVATE: "git.yadr00.internal/*"

    steps:
      - name: Install system dependencies
        # git/curl — для checkout и CA; podman — сборка/ран образа;
        # python3+jq — fixture-upstream и парсинг JSON в smoke.sh.
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git curl podman python3 jq

      - name: Trust Local CA
        run: |
          curl -k https://172.20.0.1:9000/roots.pem -o /etc/pki/ca-trust/source/anchors/step-ca.crt
          update-ca-trust
          git config --global http.sslCAInfo /etc/pki/ca-trust/source/anchors/step-ca.crt

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine build version
        env:
          SHA: ${{ github.sha }}
        run: |
          TAG_VERSION="$(git describe --exact-match --tags --match='v*' HEAD 2>/dev/null || true)"
          if [ -n "$TAG_VERSION" ]; then
            VERSION="$TAG_VERSION"
          else
            VERSION="sha-${SHA:0:8}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IS_TAG=${TAG_VERSION:+yes}" >> "$GITHUB_ENV"

      - name: Build image
        # Только amd64 в CI — кросс-сборка arm64 через QEMU медленная и
        # требует qemu-user-static+binfmt_misc (опционально, см. Makefile).
        # Мульти-арх релиз собирается отдельно при наличии QEMU.
        run: |
          make image PLATFORMS=linux/amd64 \
            IMAGE=ghcr.io/alexrus1234/khrazhevnik TAG="${VERSION}"

      - name: Smoke test
        env:
          IMAGE: ghcr.io/alexrus1234/khrazhevnik
          TAG: ${{ env.VERSION }}
        run: test/smoke/smoke.sh

      - name: Tag localhost/testing (non-release)
        if: env.IS_TAG != 'yes'
        run: |
          podman tag ghcr.io/alexrus1234/khrazhevnik:${VERSION} localhost/testing:latest
          echo "Образ отмечен как localhost/testing:latest (не релизный билд)"

      - name: Push to registry (release tag)
        if: env.IS_TAG == 'yes'
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "::warning::secrets.REGISTRY_TOKEN не задан — push пропущен"
            exit 0
          fi
          podman login ghcr.io -u "$REGISTRY_USER" -p "$REGISTRY_TOKEN"
          podman push ghcr.io/alexrus1234/khrazhevnik:${VERSION}
          podman tag  ghcr.io/alexrus1234/khrazhevnik:${VERSION} ghcr.io/alexrus1234/khrazhevnik:latest
          podman push ghcr.io/alexrus1234/khrazhevnik:latest

      - name: Cleanup image
        if: always()
        run: podman rmi -f ghcr.io/alexrus1234/khrazhevnik:${VERSION} localhost/testing:latest >/dev/null 2>&1 || true
