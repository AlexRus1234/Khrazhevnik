# CI: build + test pipeline. Structure mirrors the lentovodec/Intermasq
# build workflow (workflow_dispatch + inputs, fedora:44 runner, Nora
# proxy, step-ca, Go tarball). Project-specific additions: services block
# (postgres/mariadb/minio для контрактных suite сессии 17) и отдельная
# oci job (сборка образа + push в git.yadr00.internal/build/khrazhevnik —
# Хражевник контейнерный
# сервис, в отличие от CLI-бинарника lentovodec).

name: Build and Test Hrazhevnik

on:
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: "Upload binary to Forgejo Packages and Release on success?"
        required: true
        default: false
        type: boolean
      publish_github:
        description: "Create GitHub Release and upload binary assets?"
        required: true
        default: false
        type: boolean
      publish_codeberg:
        description: "Create Codeberg Release and upload binary assets?"
        required: true
        default: false
        type: boolean
      version_tag:
        description: "Fallback version when HEAD has no exact v* tag."
        required: false
        default: ""
        type: string
      run_race_tests:
        description: "Run go test with -race (slower, more thorough)?"
        required: true
        default: true
        type: boolean
      run_e2e_tests:
        description: "Run Playwright E2E smoke (web/e2e) vs the built binary? Installs chromium; opt-in."
        required: true
        default: false
        type: boolean
      run_distro_tests:
        description: "Run distro E2E: real package managers via DooD socket (needs run on linux runner with podman socket)"
        required: true
        default: false
        type: boolean
      use_socks_proxy:
        description: "Route upstream fetches through SOCKS5 proxy from SOCKS_PROXY_URL (socks5://host:port; optional SOCKS_PROXY_USER/SOCKS_PROXY_PASSWORD auth)"
        required: true
        default: false
        type: boolean

jobs:
  build-test:
    runs-on: docker
    container:
      image: fedora:44
    env:
      # All external dependencies via Nora where possible
      GOPROXY: "https://nora.panelka.yadr01.internal/go,direct"
      GOSUMDB: "off"
      GOPRIVATE: "git.yadr00.internal/*"
      # NOTE: do NOT set SSL_CERT_FILE / NODE_EXTRA_CA_CERTS to step-ca.crt
      # directly — that overrides the system bundle and breaks public-CA
      # trust (curl to go.dev / npm / etc fails with "unexpected end of file").
      # The 'update-ca-trust' step below adds step-ca to the system bundle,
      # after which all tools trust both public CAs AND step-ca transparently.

    # Сервисные контейнеры для контрактных suite (сессия 17): postgres,
    # mariadb и minio (S3-совместимое хранилище). Доступны из job-
    # контейнера по имени сервиса как хостнейма (postgres:5432 и т.д.).
    # Контрактные suite в test/integration/contract_drivers_test.go
    # гейт'ятся по env KHRZ_TEST_*_DSN/ENDPOINT; без env — t.Skip.
    # fs+sqlite гоняются всегда (без внешних сервисов).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: khrazhevnik
          POSTGRES_PASSWORD: khrazhevnik
          POSTGRES_DB: khrazhevnik
        options: --health-cmd="pg_isready -U khrazhevnik" --health-interval=5s --health-timeout=3s --health-retries=10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_USER: khrazhevnik
          MARIADB_PASSWORD: khrazhevnik
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: khrazhevnik
        options: --health-cmd="mariadb-admin ping -h localhost -u root -prootpass" --health-interval=5s --health-timeout=3s --health-retries=10
      minio:
        # minio/minio: запуск `server /data`; креды — env MINIO_ROOT_*.
        # health/live — встроенный liveness-эндпойнт минио.
        image: minio/minio
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: --health-cmd="curl -fsS http://localhost:9000/minio/health/live || exit 1" --health-interval=5s --health-timeout=3s --health-retries=10
        cmd:
          - server
          - /data

    steps:
      - name: Install git first (minimal fedora image lacks it)
        run: dnf install -y --setopt=install_weak_deps=False git curl

      - name: Trust Local CA
        run: |
          curl -k https://172.20.0.1:9000/roots.pem -o /etc/pki/ca-trust/source/anchors/step-ca.crt
          update-ca-trust
          git config --global http.sslCAInfo /etc/pki/ca-trust/source/anchors/step-ca.crt

      - name: Configure Nora RPM repo (custom packages if needed)
        run: |
          cat > /etc/yum.repos.d/nora.repo << 'EOF'
          [nora-runner]
          name=Nora Runner Dependencies
          baseurl=https://nora.panelka.yadr01.internal/rpm/runner/
          gpgcheck=0
          enabled=1
          priority=1
          sslverify=1
          EOF

      - name: Install remaining system dependencies
        # gcc нужен только для `go test -race` (CGO); сам бинарник
        # собирается с CGO_ENABLED=0 (static, modernc-sqlite pure Go).
        # nodejs нужен НЕ проекту, а раннеру: act/act_runner исполняет
        # JS-экшены (actions/checkout@v4) через node ВНУТРИ job-контейнера;
        # fedora:44 его не содержит → crun "node not found", exit 127.
        # npm — для сборки Vue-SPA (cd web && npm ci && npm run build,
        # шаг ниже): до сессии 18.1 фронтенда не было, npm был не нужен.
        # jq — для парсинга JSON в publish-шагах ниже.
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            bash tar \
            nodejs npm \
            jq \
            gcc

      - name: Install Go toolchain
        run: |
          # Fedora 44 ships an older Go; khrazhevnik needs 1.26 (go.mod).
          # Tarball from go.dev. -f: fail on HTTP errors (don't pipe HTML
          # error page into tar). Download first, then extract, so we get a
          # clear error if URL is wrong.
          curl -fsSL https://go.dev/dl/go1.26.3.linux-amd64.tar.gz -o /tmp/go.tar.gz
          ls -lh /tmp/go.tar.gz
          tar -C /usr/local -xzf /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH
          /usr/local/go/bin/go version

      - name: Configure npm registry to Nora
        # Все внешние зависимости через Nora (как и GOPROXY выше):
        # изолирует сборку от registry.npmjs.org, единый кеш/зеркало.
        run: npm config set registry https://nora.panelka.yadr01.internal/npm/

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Теги нужны для определения версии сборки ниже.
          fetch-depth: 0

      - name: Determine build version
        env:
          VERSION_INPUT: ${{ github.event.inputs.version_tag }}
          SHA: ${{ github.sha }}
        run: |
          TAG_VERSION="$(git describe --exact-match --tags --match='v*' HEAD 2>/dev/null || true)"
          if [ -n "$TAG_VERSION" ]; then
            VERSION="$TAG_VERSION"
            echo "Using exact Git tag: $VERSION"
          elif [ -n "$VERSION_INPUT" ]; then
            VERSION="$VERSION_INPUT"
            echo "HEAD has no exact v* tag; using workflow input: $VERSION"
          else
            VERSION="sha-${SHA:0:8}"
            echo "HEAD has no exact v* tag and no input; using: $VERSION"
          fi

          case "$VERSION" in
            v[0-9]*|sha-[0-9a-f]*) ;;
            *) echo "::error::invalid version '$VERSION' (expected v* or sha-<hex>)"; exit 1 ;;
          esac

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION=${VERSION#v}" >> "$GITHUB_ENV"
          echo "EXACT_TAG=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Build frontend
        # ДО любого Go-команда: internal/core/web/spa.go делает
        # //go:embed assets и //go:embed assets/index.html — без собранного
        # бандла (папки assets нет в git, см. .gitignore) go vet /
        # golangci-lint / go test / go build падают на compile-time embed.
        # web-build = vue-tsc (typecheck) + vite build → ../internal/core/web/assets.
        run: cd web && npm ci && npm run build

      - name: Install golangci-lint
        # Пин той же версии, что в локальной разработке; собирается
        # через Nora-прокси текущим тулчейном.
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build binary
        # Для package main линкер Go 1.26 принимает только путь main.Version
        # (полный importpath в -X молча не применяется; проверено локально
        # на go1.26.3). Intermasq использует полный путь, потому что там
        # Version живёт в НЕ-main пакете internal/version.
        run: |
          CGO_ENABLED=0 \
          go build -trimpath \
            -ldflags="-s -w -X main.Version=${APP_VERSION}" \
            -o khrazhevnik-ci ./cmd/khrazhevnik
          # Sanity: -version — без флага бинарник уже сервер: он читает
          # конфиг и падает на пустом jwt_secret (это тоже проверено,
          # но интеграционными тестами, не CI-сборкой).
          ./khrazhevnik-ci -version

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          FMT_OUT="$(gofmt -l .)"
          if [ -n "$FMT_OUT" ]; then
            echo "::error::Files need gofmt:"
            echo "$FMT_OUT"
            exit 1
          fi

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: Go tests (unit + integration)
        # -race requires CGO (and gcc). The binary itself is built with
        # CGO_ENABLED=0 for static linking (modernc.org/sqlite is pure Go);
        # tests opt back in here. Integration suite (test/integration/...)
        # — build-tag-gated (-tags integration), гоняется с сервисными
        # контейнерами (postgres/mariadb/minio выше).
        env:
          RACE_FLAG: ${{ github.event.inputs.run_race_tests == 'true' && '-race' || '' }}
          CGO_ENABLED: "1"
          KHRZ_TEST_POSTGRES_DSN: "postgres://khrazhevnik:khrazhevnik@postgres:5432/khrazhevnik"
          KHRZ_TEST_MARIADB_DSN: "khrazhevnik:khrazhevnik@tcp(mariadb:3306)/khrazhevnik"
          KHRZ_TEST_S3_ENDPOINT: "http://minio:9000"
          KHRZ_TEST_S3_REGION: "us-east-1"
          KHRZ_TEST_S3_ACCESS_KEY: "minioadmin"
          KHRZ_TEST_S3_SECRET_KEY: "minioadmin"
          # Путь к собранному артефакту для test/integration/binary_smoke_test.go
          # (exec'ит khrazhevnik-ci как процесс; build-test job собирает его ранее).
          KHRZ_TEST_BINARY: "${{ github.workspace }}/khrazhevnik-ci"
        run: |
          echo "Running: go test ./... $RACE_FLAG -count=1"
          go test ./... $RACE_FLAG -count=1
          echo "Running: integration suite"
          go test $RACE_FLAG -tags=integration ./test/integration/... -count=1

      - name: Coverage report
        # Separate step (no -race) so instrumentation overhead & race detector
        # don't skew numbers. Informational only — thresholds live in
        # docs/TESTING.md. Сессия 26: merged-профиль — unit + integration
        # (с -coverpkg=./...), иначе вклад integration-сьюта в покрытие не
        # попадает в цифру. Сервисные env — как в шаге Go tests: без них
        # контрактные suite pg/mariadb/s3 скипаются и профиль неполон.
        env:
          CGO_ENABLED: "1"
          KHRZ_TEST_POSTGRES_DSN: "postgres://khrazhevnik:khrazhevnik@postgres:5432/khrazhevnik"
          KHRZ_TEST_MARIADB_DSN: "khrazhevnik:khrazhevnik@tcp(mariadb:3306)/khrazhevnik"
          KHRZ_TEST_S3_ENDPOINT: "http://minio:9000"
          KHRZ_TEST_S3_REGION: "us-east-1"
          KHRZ_TEST_S3_ACCESS_KEY: "minioadmin"
          KHRZ_TEST_S3_SECRET_KEY: "minioadmin"
        run: |
          go test ./... -count=1 -covermode=atomic -coverprofile cover-unit.out
          go test -tags=integration ./test/integration/... -count=1 \
            -covermode=atomic -coverpkg=./... -coverprofile cover-int.out
          # Merge без gocovmerge: шапка mode: один раз, тело — конкатенация
          # обоих профилей с дедупликацией одинаковых строк (sort -u).
          # Одинаковые блоки с разными счётчиками go tool cover суммирует
          # (режим atomic) — 0 от одного прогона + счётчик другого = истина.
          { head -n 1 cover-unit.out; tail -qn +2 cover-unit.out cover-int.out | sort -u; } > coverage.out
          echo "===== Coverage summary (unit + integration merged) ====="
          go tool cover -func coverage.out | tail -n 1
          echo "===== Per-package ====="
          go tool cover -func coverage.out | grep -E '^khrazhevnik/' | sort

      - name: L4 — Playwright E2E (opt-in)
        # Web UI e2e-смоук поверх СОБРАННОГО артефакта khrazhevnik-ci:
        # global-setup (web/e2e/global-setup.ts) сам поднимает бинарник
        # с temp-TOML на свободных портах и убивает его после прогона
        # (вложенный podman на раннере невозможен — потому не контейнер,
        # а exec процесса; паттерн binary_smoke_test.go). Сценарий:
        # setup → login → apt-репо → upload .deb → reindex → публичный
        # Release byte-exact + переключатель ru/en + локализация кодов
        # ошибок (web/e2e/smoke.spec.ts).
        #
        # NOTE on deps (проверено в Intermasq L4): `npx playwright install
        # --with-deps` знает только apt (Ubuntu/Debian) и на fedora-контейнере
        # падает на `apt-get: command not found`. Поэтому shared-lib-депы
        # chromium ставим сами через dnf, браузер — без --with-deps. Полный
        # gtk3 НЕ ставим: тянет десктоп-стек (pipewire/openh264 с внешнего
        # кодек-зеркала); headless-хрому достаточно перечисленного.
        if: success() && github.event.inputs.run_e2e_tests == 'true'
        env:
          KHRZ_TEST_BINARY: "${{ github.workspace }}/khrazhevnik-ci"
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            nss nspr atk at-spi2-atk cups-libs libdrm libxkbcommon \
            libX11 libXcomposite libXdamage libXext libXfixes libXrandr \
            mesa-libgbm pango alsa-lib libxshmfence
          cd web
          # @playwright/test уже в node_modules (npm ci шага Build frontend).
          npx playwright install chromium
          npx playwright test

      - name: Show binary info
        run: |
          ls -lh khrazhevnik-ci
          ARTIFACT_NAME="khrazhevnik-${VERSION}-linux-amd64"
          cp khrazhevnik-ci "$ARTIFACT_NAME"
          sha256sum "$ARTIFACT_NAME" | tee "${ARTIFACT_NAME}.sha256"

      - name: Publish to Forgejo Packages
        if: success() && github.event.inputs.push_to_registry == 'true'
        env:
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: |
          echo "Publishing as version: $VERSION"
          ARTIFACT_NAME="khrazhevnik-${VERSION}-linux-amd64"

          PUBLISH_FILES="$ARTIFACT_NAME ${ARTIFACT_NAME}.sha256"
          echo "Files to publish: $PUBLISH_FILES"

          # Generic package registry: каждый файл по своему пути.
          for FILE in $PUBLISH_FILES; do
            curl -fSR --cacert /etc/pki/ca-trust/source/anchors/step-ca.crt \
                 --user "alexrus:${UPLOAD_TOKEN}" \
                 --upload-file "./${FILE}" \
                 "https://git.yadr00.internal/api/packages/AlexRus1234/generic/khrazhevnik/${VERSION}/${FILE}"
          done
          echo "Published Forgejo packages: $PUBLISH_FILES"

          API="https://git.yadr00.internal/api/v1/repos/AlexRus1234/Hrazhevnik"
          RELEASE_ID="$(curl -fsSL --user "alexrus:${UPLOAD_TOKEN}" \
            "$API/releases/tags/${VERSION}" 2>/dev/null | jq -r '.id // empty' 2>/dev/null || true)"
          if [ -z "$RELEASE_ID" ]; then
            BODY="$(jq -n --arg tag "$VERSION" '{tag_name:$tag, name:$tag, draft:false, prerelease:($tag | test("-"))}')"
            RELEASE="$(curl -fsSL -X POST \
              --user "alexrus:${UPLOAD_TOKEN}" \
              -H 'Content-Type: application/json' \
              "$API/releases" -d "$BODY")"
            RELEASE_ID="$(jq -r '.id' <<<"$RELEASE")"
            test -n "$RELEASE_ID" && test "$RELEASE_ID" != "null"
          else
            echo "Release ${VERSION} already exists (id=${RELEASE_ID}), reusing"
          fi
          for FILE in $PUBLISH_FILES; do
            curl -fsSL -X POST \
              --user "alexrus:${UPLOAD_TOKEN}" \
              -F "attachment=@${FILE}" \
              "$API/releases/${RELEASE_ID}/assets?name=${FILE}"
          done
          echo "Published local Forgejo Release ${VERSION}"

      - name: Publish GitHub Release
        if: success() && github.event.inputs.publish_github == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          if [ "$EXACT_TAG" != "$VERSION" ]; then
            echo "::error::GitHub Release requires HEAD to have the exact tag $VERSION"
            exit 1
          fi
          ARTIFACT_NAME="khrazhevnik-${VERSION}-linux-amd64"
          PUBLISH_FILES="$ARTIFACT_NAME ${ARTIFACT_NAME}.sha256"
          echo "Files to publish: $PUBLISH_FILES"
          API="https://api.github.com/repos/AlexRus1234/Hrazhevnik"
          BODY="$(jq -n --arg tag "$VERSION" '{tag_name:$tag, name:$tag, draft:false, prerelease:($tag | test("-"))}')"
          RELEASE="$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${RELEASE_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            "$API/releases" -d "$BODY")"
          UPLOAD_URL="$(jq -r '.upload_url' <<<"$RELEASE" | sed 's/{?name,label}//')"
          test -n "$UPLOAD_URL" && test "$UPLOAD_URL" != "null"
          for FILE in $PUBLISH_FILES; do
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${RELEASE_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'Content-Type: application/octet-stream' \
              --data-binary "@${FILE}" \
              "${UPLOAD_URL}?name=${FILE}"
          done
          echo "Published GitHub Release ${VERSION} (files: $PUBLISH_FILES)"

      - name: Publish Codeberg Release
        if: success() && github.event.inputs.publish_codeberg == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.TOKEN_CODEBERG }}
        run: |
          if [ "$EXACT_TAG" != "$VERSION" ]; then
            echo "::error::Codeberg Release requires HEAD to have the exact tag $VERSION"
            exit 1
          fi
          ARTIFACT_NAME="khrazhevnik-${VERSION}-linux-amd64"
          PUBLISH_FILES="$ARTIFACT_NAME ${ARTIFACT_NAME}.sha256"
          echo "Files to publish: $PUBLISH_FILES"
          API="https://codeberg.org/api/v1/repos/AlexRus1234/Hrazhevnik"
          BODY="$(jq -n --arg tag "$VERSION" '{tag_name:$tag, name:$tag, draft:false, prerelease:($tag | test("-"))}')"
          RELEASE="$(curl -fsSL -X POST \
            -H "Authorization: token ${RELEASE_TOKEN}" \
            -H 'Content-Type: application/json' \
            "$API/releases" -d "$BODY")"
          RELEASE_ID="$(jq -r '.id' <<<"$RELEASE")"
          test -n "$RELEASE_ID" && test "$RELEASE_ID" != "null"
          for FILE in $PUBLISH_FILES; do
            curl -fsSL -X POST \
              -H "Authorization: token ${RELEASE_TOKEN}" \
              -F "attachment=@${FILE}" \
              "$API/releases/${RELEASE_ID}/assets?name=${FILE}"
          done
          echo "Published Codeberg Release ${VERSION} (files: $PUBLISH_FILES)"

      - name: Cleanup
        if: always()
        run: |
          rm -f khrazhevnik-ci \
                khrazhevnik-*linux-amd64 khrazhevnik-*linux-amd64.sha256 \
                coverage.out cover-unit.out cover-int.out

  # Сборка OCI-образа → push в Forgejo container registry.
  # Алгоритм 1-в-1 по образцу 0_ЦОД/container-build (mortis/nora/memos):
  # job-контейнер quay.io/containers/podman (podman преднастроен для nested-
  # CI), storage driver vfs флагом на каждом podman-вызове (overlay-in-overlay
  # не поддерживается внутри раннера), push в git.yadr00.internal/build/
  # khrazhevnik. БЕЗ --privileged и БЕЗ smoke: контейнер = FROM scratch
  # (бинарник + CA-bundle), функционально идентичен артефакту, который уже
  # протестирован в build-test job — включая binary-smoke (exec'ит
  # khrazhevnik-ci как процесс: /healthz→setup→login→proxy byte-exact→404
  # →SIGTERM exit 0), см. test/integration/binary_smoke_test.go. Container-
  #   smoke (test/smoke/smoke.sh, podman run) — покрыт в CI job'ом distro-test
  #   (DooD через /run/user/968/podman/podman.sock: sibling-контейнер, не
  #   вложенность). Ограничение касалось только PinP-подхода в этом job'е
  #   (podman внутри podman, --storage-driver=vfs). Локальный smoke.sh перед
  #   релизом остаётся (RELEASE.md чеклист) — distro-test его не отменяет.
  oci:
    runs-on: docker
    container:
      image: quay.io/containers/podman:latest

    steps:
      - name: Trust Local CA
        run: |
          curl -k https://172.20.0.1:9000/roots.pem -o /etc/pki/ca-trust/source/anchors/step-ca.crt
          update-ca-trust
          git config --global http.sslCAInfo /etc/pki/ca-trust/source/anchors/step-ca.crt

      - name: Configure Nora RPM repo
        run: |
          cat > /etc/yum.repos.d/nora.repo << 'EOF'
          [nora-runner]
          name=Nora Runner Dependencies
          baseurl=https://nora.panelka.yadr01.internal/rpm/runner/
          gpgcheck=0
          enabled=1
          priority=1
          sslverify=1
          EOF

      - name: Install dependencies
        # git — checkout + git describe в Containerfile; nodejs — для
        # actions/checkout@v4 (JS-экшен); curl — CA-даунлоад; bash — шелл-
        # степы. python3/jq/make НЕ нужны: smoke убран (бинарник гоняет
        # build-test job через binary_smoke_test.go), podman build зовём
        # напрямую (Makefile — только для локальных сборок с overlay).
        run: dnf install -y --setopt=install_weak_deps=False git curl bash nodejs

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine build version
        env:
          SHA: ${{ github.sha }}
        run: |
          TAG_VERSION="$(git describe --exact-match --tags --match='v*' HEAD 2>/dev/null || true)"
          if [ -n "$TAG_VERSION" ]; then
            VERSION="$TAG_VERSION"
          else
            VERSION="sha-${SHA:0:8}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IS_TAG=${TAG_VERSION:+yes}" >> "$GITHUB_ENV"

      - name: Build image
        # vfs: единственный driver, работающий на overlayfs backing FS внутри
        # контейнера раннера. amd64 single-platform; multi-арх релиз — с QEMU.
        run: |
          podman --storage-driver=vfs build \
            --build-arg VERSION="${VERSION}" \
            -t git.yadr00.internal/build/khrazhevnik:${VERSION} \
            -f deploy/Containerfile .

      - name: Push to Forgejo Registry
        env:
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: |
          if [ -z "$UPLOAD_TOKEN" ]; then
            echo "::warning::secrets.UPLOAD_TOKEN не задан — push пропущен"
            exit 0
          fi
          podman --storage-driver=vfs login git.yadr00.internal -u alexrus -p "$UPLOAD_TOKEN"
          podman --storage-driver=vfs push git.yadr00.internal/build/khrazhevnik:${VERSION}

      - name: Tag and push :latest (release tag)
        if: env.IS_TAG == 'yes'
        env:
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: |
          podman --storage-driver=vfs tag git.yadr00.internal/build/khrazhevnik:${VERSION} git.yadr00.internal/build/khrazhevnik:latest
          podman --storage-driver=vfs push git.yadr00.internal/build/khrazhevnik:latest

      - name: Cleanup
        if: always()
        run: podman --storage-driver=vfs system prune -a -f

  # Distro-test (opt-in): реальные пакетные менеджеры ПЯТИ экосистем
  # ставят пакеты через Хражевник (pull-through живых upstream), кеш
  # доказан фактами (X-Cache: HIT + /api/v1/cache/stats). Матрица
  # (сессия 73): одна нога = одна экосистема v1 (debian/fedora/arch/
  # alpine/nix); fail-fast: false — красная волатильная нога (nix:
  # eval-тарбол nixpkgs качается с github мимо binary-cache; fedora:
  # полное dnf-дерево) не топит остальные. DooD, а не PinP: сокет
  # /run/user/968/podman/podman.sock — демон ХОСТОВЫЙ, job-контейнер лишь
  # клиент: mount /proc не выполняется, ограничение rootless-раннера на
  # вложенность (см. комментарий oci job) касалось podman ВНУТРИ job-
  # контейнера. needs: build-test, НЕ oci: образ собирается здесь же
  # (Containerfile.test, сессия 71) — падение/отключение oci не должно
  # скипать ногу.
  distro-test:
    needs: build-test
    if: github.event.inputs.run_distro_tests == 'true'
    runs-on: docker
    container:
      image: fedora:44
      options: --security-opt label=disable -v /run/user/968/podman/podman.sock:/run/podman/podman.sock
    env:
      # podman-клиент в job-контейнере говорит с хостовым демоном через
      # проброшенный сокет (DooD). CONTAINER_HOST — документированная
      # переменная remote-режима podman (podman-remote(1): приоритет —
      # флаг --url → CONTAINER_HOST → containers.conf → локальный дефолт).
      # CI-факт 2026-09-06: одного DOCKER_HOST мало — podman
      # инициализировал СВОЁ хранилище ВНУТРИ job-контейнера (rootless
      # single mapping + overlay поверх overlayfs-корня контейнера,
      # fuse-overlayfs нет при install_weak_deps=False → "overlay is not
      # supported over overlayfs"). DOCKER_HOST оставлен для
      # docker-совместимых клиентов.
      CONTAINER_HOST: unix:///run/podman/podman.sock
      DOCKER_HOST: unix:///run/podman/podman.sock

    strategy:
      fail-fast: false
      matrix:
        include:
          # trusted=yes — кеш-прокси раздаёт чужие подписи байтово
          # (инвариант кеша), ключ Debian ноге не нужен; вырезание
          # debian.sources — зелёный не может пройти мимо прокси
          # (единственный source — инстанс).
          - name: debian
            image: docker.io/library/debian:bookworm
            eco: apt
            remote: debian
            base_url: https://deb.debian.org/debian
            check_path: /apt/debian/dists/bookworm/Release
            setup: |
              set -eu
              rm -f /etc/apt/sources.list.d/debian.sources
              echo "deb [trusted=yes] http://khrz-app-debian:29202/apt/debian bookworm main" \
                > /etc/apt/sources.list.d/khrz.list
              apt-get update -qq && apt-get install -y -qq htop
          # rm *.repo — герметичность: dnf не может уйти мимо прокси
          # (единственный source — инстанс); gpgcheck=0 — репомд
          # прокси без ключа (подписи upstream байтовы, но ключ
          # ноге не ставим — прокси-passthrough, не личное репо).
          - name: fedora
            image: docker.io/library/fedora:44
            eco: rpm-md
            remote: fedora
            base_url: https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/os/
            check_path: /rpm/fedora/repodata/repomd.xml
            setup: |
              set -eu
              rm -f /etc/yum.repos.d/*.repo
              cat > /etc/yum.repos.d/khrz.repo << 'EOF'
              [khrz]
              baseurl=http://khrz-app-fedora:29202/rpm/fedora/
              gpgcheck=0
              enabled=1
              EOF
              dnf install -y htop
          # extra закомментирован — репо extra через прокси не создан
          # (не упомянут в матрице); пакет из core: curl (htop лежит
          # в extra). $repo в single-quoted echo — хост-шелл не
          # разворачивает, pacman получает литерал.
          - name: arch
            image: docker.io/library/archlinux:latest
            eco: pacman
            remote: arch
            base_url: https://geo.mirror.pkgbuild.com
            check_path: /pacman/arch/core/os/x86_64/core.db
            setup: |
              set -eu
              sed -i '/^\[extra\]/,/^\[/ s/^/#/' /etc/pacman.conf
              echo 'Server = http://khrz-app-arch:29202/pacman/arch/$repo/os/$arch' \
                > /etc/pacman.d/mirrorlist
              pacman -Sy --noconfirm curl
          # edge-образ согласован с edge/main (решение владельца);
          # htop в edge — именно main, факт pkgs.alpinelinux.org
          # (2026-09-06, htop 3.5.3-r0, repository: main).
          - name: alpine
            image: docker.io/library/alpine:edge
            eco: apk
            remote: alpine
            base_url: https://dl-cdn.alpinelinux.org/alpine
            check_path: /apk/alpine/edge/main/x86_64/APKINDEX.tar.gz
            setup: |
              set -eu
              echo "http://khrz-app-alpine:29202/apk/alpine/edge/main" \
                > /etc/apk/repositories
              apk update && apk add htop
          # nixos/nix работает root — trusted-substituter не нужен;
          # narinfo/nar идут через нас, byte-exact подписи валидны
          # (сессия 48: narinfo mutable). eval-тарбол nixpkgs качается
          # с github МИМО binary-cache протокола — ожидаемо, нога
          # доказывает именно substituter-passthrough.
          # --extra-experimental-features: nix-command/flakes в Nix
          # 2.30 всё ещё experimental (nix.dev/manual/nix/2.30), а
          # nix.conf образа nixos/nix содержит только sandbox=false —
          # без флага nix profile install падает до первого запроса.
          - name: nix
            image: docker.io/nixos/nix:latest
            eco: nix
            remote: cache
            base_url: https://cache.nixos.org
            check_path: /nix/cache/nix-cache-info
            setup: |
              set -eu
              nix profile install nixpkgs#htop \
                --option substituters http://khrz-app-nix:29202/nix/cache \
                --extra-experimental-features 'nix-command flakes'

    steps:
      - name: Install dependencies
        # nodejs — НЕ проекту, а раннеру: act/act_runner исполняет JS-экшены
        # (actions/checkout@v4) через node ВНУТРИ job-контейнера; fedora:44
        # его не содержит → crun "node not found", exit 127 (см. build-test).
        # openssl-CLI НЕ входит в минимальный fedora-образ (curl тянет
        # только openssl-libs), а Start app генерирует JWT-секрет
        # `openssl rand -hex 32`. podman — DooD-клиент; jq/curl —
        # bootstrap admin-API; git — checkout.
        run: dnf install -y --setopt=install_weak_deps=False podman jq curl git nodejs npm openssl

      - name: Trust Local CA
        # До Checkout: git.yadr00.internal — сертификат step-ca.
        run: |
          curl -k https://172.20.0.1:9000/roots.pem -o /etc/pki/ca-trust/source/anchors/step-ca.crt
          update-ca-trust
          git config --global http.sslCAInfo /etc/pki/ca-trust/source/anchors/step-ca.crt

      - name: Check socks secret (opt-in proxy)
        # use_socks_proxy=true без секрета — конфигурационная ошибка
        # запуска, нога сразу падает с внятной причиной, а не тишеё 502
        # на первом же фетче. Схема socks5:// обязательна: Go
        # ProxyFromEnvironment трактует значение без схемы как HTTP-
        # прокси (пошлёт HTTP CONNECT на SOCKS-порт — не сработает).
        # Логин/пароль (RFC 1929) опциональны: секреты заданы — userinfo
        # вклеивается в URL (percent-encoding через jq @uri, иначе
        # спецсимволы пароля ломают парсинг URL), не заданы — ходим
        # без авторизации.
        if: github.event.inputs.use_socks_proxy == 'true'
        env:
          SOCKS_PROXY_URL: ${{ secrets.SOCKS_PROXY_URL }}
          SOCKS_PROXY_USER: ${{ secrets.SOCKS_PROXY_USER }}
          SOCKS_PROXY_PASSWORD: ${{ secrets.SOCKS_PROXY_PASSWORD }}
        run: |
          test -n "$SOCKS_PROXY_URL" || { echo "::error::use_socks_proxy=true, но SOCKS_PROXY_URL не задан"; exit 1; }
          case "$SOCKS_PROXY_URL" in
            socks5://*|socks5h://*) ;;
            *) echo "::error::SOCKS_PROXY_URL требует схему socks5://host:port (без схемы Go считает её HTTP-прокси)"; exit 1 ;;
          esac
          PROXY_URL="$SOCKS_PROXY_URL"
          if [ -n "$SOCKS_PROXY_USER" ]; then
            u="$(jq -rn --arg s "$SOCKS_PROXY_USER" '$s|@uri')"
            p="$(jq -rn --arg s "$SOCKS_PROXY_PASSWORD" '$s|@uri')"
            rest="${SOCKS_PROXY_URL#socks5h://}"; rest="${rest#socks5://}"; rest="${rest#*@}"
            PROXY_URL="socks5://${u}:${p}@${rest}"
          fi
          echo "PROXY_URL=$PROXY_URL" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe podman daemon
        # Факт, не память: какой демон отвечает клиенту (client/server в
        # version) и какой у него storage (graph driver + root) — без
        # этого падение configure-storage диагностируется гаданием.
        run: |
          podman version
          podman info --format 'driver={{.Store.GraphDriverName}} root={{.Store.GraphRoot}}'

      - name: Build khrazhevnik:test image
        # БЕЗ --storage-driver=vfs (в отличие от oci job): демон хостовый,
        # storage-драйвер выбирает хост; vfs-хак нужен только при
        # overlay-in-overlay ВНУТРИ контейнера.
        run: podman build -t localhost/khrazhevnik:test-${{ matrix.name }} -f deploy/Containerfile.test .

      - name: Create isolated network
        run: podman network create khrz-${{ matrix.name }}-net

      - name: Start khrazhevnik app
        # bind-mount TOML нельзя: DooD резолвит пути на ХОСТЕ, файла там
        # нет — конфиг только env-слоем KHRZ_AUTH__* (нативен контейнеру).
        # JWT ≥32 байт — валидация конфига (сессия 22). Go читает
        # HTTP(S)_PROXY (ProxyFromEnvironment, wire.go), не ALL_PROXY.
        # NO_PROXY — исключения, ходящие МИМО прокси: exec-bootstrap
        # curl внутри контейнера ходит на localhost (:30202/:29202),
        # без исключения self-bootstrap улетел бы в socks.
        run: |
          PROXY_ARGS=""
          if [ "${{ github.event.inputs.use_socks_proxy }}" = "true" ]; then
            PROXY_ARGS="-e HTTP_PROXY=$PROXY_URL -e HTTPS_PROXY=$PROXY_URL -e NO_PROXY=localhost,127.0.0.1"
          fi
          podman run -d --name khrz-app-${{ matrix.name }} --network khrz-${{ matrix.name }}-net \
            -e KHRZ_AUTH__JWT_SECRET="$(openssl rand -hex 32)" \
            $PROXY_ARGS \
            localhost/khrazhevnik:test-${{ matrix.name }}

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 30); do
            if podman exec khrz-app-${{ matrix.name }} curl -fsS http://localhost:29202/healthz; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/healthz не ответил за 30с"
          podman logs khrz-app-${{ matrix.name }} || true
          exit 1

      - name: Bootstrap admin + remote
        # учётка admin/distropw — тестовая, живёт считанные минуты в
        # изолированной сети: не секрет. TOKEN — в GITHUB_ENV для Verify
        # cache: /api/v1/cache/stats — admin-only на :30202. remote-JSON
        # собирается jq -n из matrix-полей — имена/URL без ручных кавычек.
        env:
          ADMIN: http://localhost:30202/api/v1
        run: |
          set -euxo pipefail
          code="$(podman exec khrz-app-${{ matrix.name }} curl -s -o /dev/null -w '%{http_code}' \
            -X POST "$ADMIN/setup" -d '{"username":"admin","password":"distropw"}')"
          test "$code" = 201
          token="$(podman exec khrz-app-${{ matrix.name }} curl -s -X POST "$ADMIN/auth/login" \
            -d '{"username":"admin","password":"distropw"}' | jq -er .token)"
          echo "TOKEN=$token" >> "$GITHUB_ENV"
          remote_json="$(jq -n --arg n '${{ matrix.remote }}' --arg e '${{ matrix.eco }}' \
            --arg u '${{ matrix.base_url }}' \
            '{name:$n, ecosystem:$e, base_url:$u, mode:"proxy", enabled:true}')"
          code="$(podman exec khrz-app-${{ matrix.name }} curl -s -o /dev/null -w '%{http_code}' \
            -X POST "$ADMIN/remotes" -H "Authorization: Bearer $token" \
            -d "$remote_json")"
          test "$code" = 201

      - name: Start distro container
        # sleep infinity держит ногу живой между exec'ами; GNU sleep
        # (debian/fedora/arch) и современный busybox (alpine, nixos/nix
        # = FROM alpine) оба понимают infinity (busybox: strncasecmp
        # "inf" — факт из исходника sleep.c).
        run: |
          podman run -d --name khrz-${{ matrix.name }} --network khrz-${{ matrix.name }}-net \
            ${{ matrix.image }} sleep infinity

      - name: Run package manager against mirror
        # setup из матрицы → файл → внутрь ноги → exec. Делимитер
        # KHRZ_SETUP_EOF: у fedora внутри setup СВОЙ heredoc 'EOF'
        # (репо-файл) — вложенность не должна закрыть внешний heredoc
        # раньше времени. sh, не bash: bash отсутствует в alpine и
        # nixos/nix (nixos/nix = FROM alpine + openssl/git); поэтому
        # сетап-скрипты POSIX и без pipefail (урок CI-факта №3 про
        # dash — ослаблен до «просто без pipefail», `set -eu` —
        # Portable), ранний стоп ветки сохранён && и set -e.
        run: |
          cat > /tmp/khrz-setup.sh << 'KHRZ_SETUP_EOF'
          ${{ matrix.setup }}
          KHRZ_SETUP_EOF
          podman cp /tmp/khrz-setup.sh khrz-${{ matrix.name }}:/tmp/khrz-setup.sh
          podman exec khrz-${{ matrix.name }} sh /tmp/khrz-setup.sh

      - name: Verify cache
        # HEAD-роут — сессия 68; запрос дважды: второй обязан HIT.
        # /api/v1/cache/stats (admin-only, :30202): hits>0 и
        # bytes_from_upstream>0 — доказывают и «работает», и
        # «кеширует»; после сессии 83 глобал — проекция per-eco
        # счётчиков, нога пишет в свою экосистему — контракт тот же.
        run: |
          set -euxo pipefail
          podman exec khrz-app-${{ matrix.name }} curl -sI "http://localhost:29202${{ matrix.check_path }}"
          second="$(podman exec khrz-app-${{ matrix.name }} curl -sI "http://localhost:29202${{ matrix.check_path }}")"
          echo "$second"
          grep -qi '^X-Cache: HIT' <<<"$second"
          podman exec khrz-app-${{ matrix.name }} curl -fsS \
            -H "Authorization: Bearer $TOKEN" \
            http://localhost:30202/api/v1/cache/stats \
            | jq -e '.hits>0 and .bytes_from_upstream>0'

      - name: Dump logs on failure
        if: failure()
        run: podman logs khrz-app-${{ matrix.name }} || true

      - name: Cleanup
        # -v — anonymous volume /var/lib/khrazhevnik со sqlite/store.
        # Строго свои ресурсы, БЕЗ system prune: демон общий с другими
        # job'ами раннера.
        if: always()
        run: |
          podman rm -fv khrz-app-${{ matrix.name }} khrz-${{ matrix.name }} || true
          podman network rm khrz-${{ matrix.name }}-net || true
          podman rmi -f localhost/khrazhevnik:test-${{ matrix.name }} || true
